name: d0-appintents-probe

# D0 构建探针（临时）：手动 swiftc + appintentsmetadataprocessor 在 Swift 6.3 上
# 无法产出 const values（前 18 轮系统性排除），改走 xcodebuild 构建最小 appex 工程
# ——这本身是执行计划 D0 失败预案 A 的候选实现：配置式组件只在 Xcode 环境构建。

on:
  push:
    branches: ['docs/usage-cost-widgets-design']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m venv scratch/iterm-probe-venv
          scratch/iterm-probe-venv/bin/python -m pip install --upgrade pip
          scratch/iterm-probe-venv/bin/python -m pip install -r requirements.txt

      - name: Build standalone app (configurable widgets via xcodebuild)
        run: python3 scripts/build_inbox_app.py --standalone

      - name: Assert widget extension (D0 gate)
        run: |
          set -euo pipefail
          APP="build/Agent Notification.app"
          APPLEX="$APP/Contents/PlugIns/Agent Notification Widgets.appex"
          EXE="$APPLEX/Contents/MacOS/AgentNotificationWidgets"
          find build -maxdepth 4 -name "*.appex" || true
          find "$APPLEX" -maxdepth 3 || true
          test -x "$EXE"
          test -e "$APPLEX/Contents/Resources/Metadata.appintents"
          echo "=== D0 PASS: Metadata.appintents produced via build_inbox_app.py ==="
          plutil -extract CFBundlePackageType raw "$APPLEX/Contents/Info.plist" | grep -qx "XPC!"
          plutil -extract CFBundleIdentifier raw "$APPLEX/Contents/Info.plist" | grep -qx "local.session-manager.inbox.widgets"
          plutil -extract NSExtension.NSExtensionPointIdentifier raw "$APPLEX/Contents/Info.plist" | grep -qx "com.apple.widgetkit-extension"
          plutil -extract CFBundleShortVersionString raw "$APPLEX/Contents/Info.plist" | grep -qx "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")"
          plutil -extract CFBundleVersion raw "$APPLEX/Contents/Info.plist" | grep -qx "$(plutil -extract CFBundleVersion raw "$APP/Contents/Info.plist")"
          nm -u "$EXE" | grep -q "_NSExtensionMain"
          ENTITLEMENTS="$(codesign -d --entitlements :- "$APPLEX" 2>/dev/null)"
          echo "$ENTITLEMENTS" | grep -q "com.apple.security.app-sandbox"
          echo "$ENTITLEMENTS" | grep -q "temporary-exception.files.home-relative-path.read-only"
          [ "$(echo "$ENTITLEMENTS" | grep -o '<key>' | wc -l | tr -d ' ')" = "2" ]
          codesign --verify --strict "$APPLEX"
          plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw "$APP/Contents/Info.plist" | grep -qx "agentnotification"
          echo "=== ALL D1 ASSERTIONS PASS ==="
