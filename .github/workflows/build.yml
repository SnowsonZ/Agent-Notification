name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 普通构建只读；写权限收敛到 tag 触发的独立 release job（2026-09-21 评审 P2）。
permissions:
  contents: read

jobs:
  harness:
    # 风险等级与修复证据由机器生成，写入 job summary；不采信手写的「已修复」「CI 通过」。
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # 交付度量读取本分支的 build 运行记录（CI 轮次）
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Resolve base
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            echo "sha=$PR_BASE" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify (quick)
        run: python harness/verify.py --quick

      - name: Hygiene of changes
        run: python harness/hygiene.py --range "${{ steps.base.outputs.sha }}"

      # 已有判定器以 base 为准：追加或新增的测试代码不能让已有测试失效（评审 PR7-R2）。
      - name: Existing tests (base version) on head
        run: python harness/base_tests.py --base "${{ steps.base.outputs.sha }}"

      # 前面的检查失败时，风险等级与证据仍要生成，评审才看得到全貌。
      - name: Risk level
        if: ${{ !cancelled() }}
        run: python harness/risk.py --base "${{ steps.base.outputs.sha }}" --github

      - name: Fix evidence
        if: ${{ !cancelled() }}
        run: python harness/evidence.py --base "${{ steps.base.outputs.sha }}" --markdown "$GITHUB_STEP_SUMMARY"

      - name: Delivery metrics
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python harness/metrics.py --base "${{ steps.base.outputs.sha }}" --github --markdown "$GITHUB_STEP_SUMMARY"

      - name: Release check (tag = build version, on main)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python harness/release_check.py --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"

  build:
    # macos-26 自带 Xcode 26：build 脚本用 actool 把 native/AppIcon.icon 编成 Liquid Glass 分层图标。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m venv scratch/iterm-probe-venv
          scratch/iterm-probe-venv/bin/python -m pip install --upgrade pip
          scratch/iterm-probe-venv/bin/python -m pip install -r requirements-dev.txt

      - name: Build zcode-focus
        run: |
          mkdir -p build
          xcrun swiftc native/ZcodeFocus.swift -o build/zcode-focus

      - name: Verify (lint, hygiene, Python and Swift tests, incident replay)
        # 与本机、云端同一入口（docs/plans/verifiable-delivery.md P1）；--strict 不允许 Swift 检查被跳过。
        run: scratch/iterm-probe-venv/bin/python harness/verify.py --strict --full

      - name: Build Agent Notification.app
        run: python3 scripts/build_inbox_app.py --standalone

      - name: Assert widget extension
        run: |
          set -euo pipefail
          APP="build/Agent Notification.app"
          APPLEX="$APP/Contents/PlugIns/Agent Notification Widgets.appex"
          EXE="$APPLEX/Contents/MacOS/AgentNotificationWidgets"
          test -x "$EXE"
          # CI（macos-26 带 Xcode）必须是配置式组件（desktop-widgets.md §6）
          test -d "$APPLEX/Contents/Resources/Metadata.appintents"  # R18：Metadata.appintents 是目录
          plutil -extract CFBundlePackageType raw "$APPLEX/Contents/Info.plist" | grep -qx "XPC!"
          plutil -extract CFBundleIdentifier raw "$APPLEX/Contents/Info.plist" | grep -qx "local.session-manager.inbox.widgets"
          plutil -extract NSExtension.NSExtensionPointIdentifier raw "$APPLEX/Contents/Info.plist" | grep -qx "com.apple.widgetkit-extension"
          plutil -extract CFBundleShortVersionString raw "$APPLEX/Contents/Info.plist" | grep -qx "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")"
          plutil -extract CFBundleVersion raw "$APPLEX/Contents/Info.plist" | grep -qx "$(plutil -extract CFBundleVersion raw "$APP/Contents/Info.plist")"
          nm -u "$EXE" | grep -q "_NSExtensionMain"
          # entitlements 恰好两项（沙盒 + 快照只读例外）
          ENTITLEMENTS="$(codesign -d --entitlements :- "$APPLEX" 2>/dev/null)"
          echo "$ENTITLEMENTS" | grep -q "com.apple.security.app-sandbox"
          echo "$ENTITLEMENTS" | grep -q "temporary-exception.files.home-relative-path.read-only"
          [ "$(echo "$ENTITLEMENTS" | grep -o '<key>' | wc -l | tr -d ' ')" = "2" ]
          codesign --verify --strict "$APPLEX"
          # 主程序 URL scheme（§5）
          plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw "$APP/Contents/Info.plist" | grep -qx "agentnotification"

      - name: Smoke test standalone bundle
        run: |
          CLI="build/Agent Notification.app/Contents/Resources/bin/session-manager"
          "$CLI" --help
          HOME="$(mktemp -d)" "$CLI" inbox rows --all

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Smoke bundled deps on minimum Python (3.11)
        # 启动器会选更新的解释器，最低支持版本用直接组合验证（评审 R1）。
        run: |
          RES="build/Agent Notification.app/Contents/Resources"
          HOME="$(mktemp -d)" PYTHONPATH="$RES/pylib" python3.11 "$RES/scripts/inbox.py" rows --all

      - name: Package
        run: |
          mkdir -p build/pkg
          cp -R "build/Agent Notification.app" build/pkg/
          ln -s /Applications build/pkg/Applications
          hdiutil create -volname "Agent Notification" -srcfolder build/pkg -ov -format UDZO build/Agent-Notification.dmg
          cd build
          zip -qry Agent-Notification.app.zip "Agent Notification.app"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Agent-Notification-macos
          path: |
            build/Agent-Notification.dmg
            build/Agent-Notification.app.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, harness]
    # 发版需用户在 environment「release」上批准（仓库设置里为它配置 required reviewer，
    # 见 docs/specs/delivery-harness.md）；harness job 已核对 tag 与构建版本一致且在 main 上。
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Agent-Notification-macos
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 本 job 不 checkout（无 .git），必须显式指定仓库。
          gh release create --repo "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" \
            --title "Agent Notification $GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*
