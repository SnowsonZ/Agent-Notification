name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m venv scratch/iterm-probe-venv
          scratch/iterm-probe-venv/bin/python -m pip install --upgrade pip
          scratch/iterm-probe-venv/bin/python -m pip install -r requirements.txt

      - name: Build zcode-focus
        run: |
          mkdir -p build
          xcrun swiftc native/ZcodeFocus.swift -o build/zcode-focus

      - name: Build Agent Notification.app
        run: python3 scripts/build_inbox_app.py --standalone

      - name: Run tests
        run: scratch/iterm-probe-venv/bin/python -m unittest discover -s tests

      - name: Package
        run: |
          mkdir -p build/pkg
          cp -R "build/Agent Notification.app" build/pkg/
          ln -s /Applications build/pkg/Applications
          hdiutil create -volname "Agent Notification" -srcfolder build/pkg -ov -format UDZO build/Agent-Notification.dmg
          cd build
          zip -qry Agent-Notification.app.zip "Agent Notification.app"
          zip -q zcode-focus.zip zcode-focus

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Notification-macos
          path: |
            build/Agent-Notification.dmg
            build/Agent-Notification.app.zip
            build/zcode-focus.zip
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Agent Notification $GITHUB_REF_NAME" \
            --generate-notes \
            build/Agent-Notification.dmg build/Agent-Notification.app.zip build/zcode-focus.zip
