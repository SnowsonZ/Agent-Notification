name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 普通构建只读；写权限收敛到 tag 触发的独立 release job（2026-09-21 评审 P2）。
permissions:
  contents: read

jobs:
  build:
    # macos-26 自带 Xcode 26：build 脚本用 actool 把 native/AppIcon.icon 编成 Liquid Glass 分层图标。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m venv scratch/iterm-probe-venv
          scratch/iterm-probe-venv/bin/python -m pip install --upgrade pip
          scratch/iterm-probe-venv/bin/python -m pip install -r requirements.txt

      - name: Build zcode-focus
        run: |
          mkdir -p build
          xcrun swiftc native/ZcodeFocus.swift -o build/zcode-focus

      - name: Swift policy tests
        run: |
          xcrun swiftc -parse-as-library native/InboxPolicy.swift tests/InboxPolicyTests.swift -o build/policy-tests
          ./build/policy-tests

      - name: Process runner tests
        run: |
          xcrun swiftc -parse-as-library native/ProcessRunner.swift tests/ProcessRunnerTests.swift -o build/runner-tests
          ./build/runner-tests

      - name: Lint Python
        run: |
          python3 -m pip install --quiet ruff==0.16.8
          ruff check scripts tests

      - name: Build Agent Notification.app
        run: python3 scripts/build_inbox_app.py --standalone

      - name: Run tests
        run: scratch/iterm-probe-venv/bin/python -W error::ResourceWarning -m unittest discover -s tests

      - name: Smoke test standalone bundle
        run: |
          CLI="build/Agent Notification.app/Contents/Resources/bin/session-manager"
          "$CLI" --help
          HOME="$(mktemp -d)" "$CLI" inbox rows --all

      - name: Package
        run: |
          mkdir -p build/pkg
          cp -R "build/Agent Notification.app" build/pkg/
          ln -s /Applications build/pkg/Applications
          hdiutil create -volname "Agent Notification" -srcfolder build/pkg -ov -format UDZO build/Agent-Notification.dmg
          cd build
          zip -qry Agent-Notification.app.zip "Agent Notification.app"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Notification-macos
          path: |
            build/Agent-Notification.dmg
            build/Agent-Notification.app.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Agent-Notification-macos
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 本 job 不 checkout（无 .git），必须显式指定仓库。
          gh release create --repo "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" \
            --title "Agent Notification $GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*
