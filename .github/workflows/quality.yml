name: quality

# 每周的测试强度与熵治理检查（docs/specs/delivery-harness.md）：较慢，不放在每次提交的门禁里。
on:
  schedule:
    - cron: '17 2 * * 1'  # 每周一 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Mutation score not below baseline
        run: python harness/mutate.py --check

      - name: Incident replay
        if: ${{ !cancelled() }}
        run: python harness/replay.py

      - name: Complexity ratchet
        if: ${{ !cancelled() }}
        run: python harness/quality.py
