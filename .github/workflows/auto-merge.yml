name: auto-merge

# L4 自治：R0/R1 的 PR 在 build 与 harness 全绿后自动合并（方案 §4、§13 E1）。
# 用 workflow_run 而不是在 PR 的 CI 里合并：workflow_run 执行 main 上的这份定义与 harness 代码，
# PR 改自己的 workflow 或 harness 影响不到这里的判定。只把 PR 的 diff 当数据读，不执行 PR 的代码。
#
# 批准（方案 §13 D3）：main 的 ruleset 要求非推送者批准最后一次推送，PR 在自己的 workflow 里用
# GITHUB_TOKEN 合并自己因此不再可行（仓库也关闭了「允许 Actions 批准 PR」）。R0/R1 由专用 GitHub App
# 批准：App 凭据放在只允许 main 使用的 environment `auto-merge` 中，PR 分支上的 workflow 取不到。
on:
  workflow_run:
    workflows: [build]
    types: [completed]

permissions:
  contents: read

jobs:
  judge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      auto_merge: ${{ steps.risk.outputs.auto_merge }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch evaluated head (data only)
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"

      - name: Risk level of the evaluated head (main's rules)
        id: risk
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python harness/risk.py --base origin/main --head "$HEAD_SHA" --github

  # 只有判定为 R0/R1 才进入 environment；R2 以上不产生部署记录，也碰不到 App 凭据。
  merge:
    needs: judge
    if: needs.judge.outputs.auto_merge == 'true'
    runs-on: ubuntu-latest
    environment: auto-merge
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: App token (approve only)
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTO_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Approve and merge R0/R1
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -z "$PR" ]; then
            echo "没有关联的 PR，跳过"
            exit 0
          fi
          # 批准绑定到评估过的提交；之后若有新推送，ruleset 作废这次批准，等新一轮 build 再判定。
          GH_TOKEN="$APP_TOKEN" gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            -f commit_id="$HEAD_SHA" -f event=APPROVE -f body="auto-merge：R0/R1，build 与 harness 通过（$HEAD_SHA）"
          # 只合并本次评估过的提交。
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$HEAD_SHA"
