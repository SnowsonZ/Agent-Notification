name: auto-merge

# L4 自治：R0/R1 的 PR 在 build 与 harness 全绿后自动合并（方案 §4、§13 E1）。
# 用 workflow_run 而不是在 PR 的 CI 里合并：workflow_run 执行 main 上的这份定义与 harness 代码，
# PR 改自己的 workflow 或 harness 影响不到这里的判定。只把 PR 的 diff 当数据读，不执行 PR 的代码。
on:
  workflow_run:
    workflows: [build]
    types: [completed]

permissions:
  contents: read

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch evaluated head (data only)
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"

      - name: Risk level of the evaluated head (main's rules)
        id: risk
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python harness/risk.py --base origin/main --head "$HEAD_SHA" --github

      - name: Merge R0/R1
        if: steps.risk.outputs.auto_merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -z "$PR" ]; then
            echo "没有关联的 PR，跳过"
            exit 0
          fi
          # 只合并本次评估过的提交：之后若有新推送，等新一轮 build 再判定。
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$HEAD_SHA"
