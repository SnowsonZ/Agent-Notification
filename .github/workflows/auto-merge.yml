name: auto-merge

# L4 自治：build 与 harness 全绿后，由 .harness/engine/cli.py policy 判定能否自动合并（目标态设计 9.3）：
# 风险 R0/R1、类别在 autonomy.toml 中为 L4、未超误差预算、不超规模阈值、任务 PR 的运行记录与 CI 轮次合格，
# 每条理由写进 job summary。
# 停机：Actions → auto-merge → Disable workflow；恢复：Enable workflow（docs/specs/delivery-harness.md §8）。
#
# 用 workflow_run 而不是在 PR 的 CI 里合并：workflow_run 执行 main 上的这份定义与 harness 代码，
# PR 改自己的 workflow 或 harness 影响不到这里的判定。只把 PR 的 diff 当数据读，不执行 PR 的代码。
#
# 批准（方案 §13 D3）：main 的 ruleset 要求非推送者批准最后一次推送，PR 在自己的 workflow 里用
# GITHUB_TOKEN 合并自己因此不再可行（仓库也关闭了「允许 Actions 批准 PR」）。自动合并的 PR 由专用 GitHub App
# 批准：App 凭据放在只允许 main 使用的 environment `auto-merge` 中，PR 分支上的 workflow 取不到。
on:
  workflow_run:
    workflows: [build]
    types: [completed]

permissions:
  contents: read

jobs:
  judge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # 只读：policy.py 读 PR 标签与 escape 议题（误差预算）、该分支的 build 运行（CI 轮次）。
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      auto_merge: ${{ steps.policy.outputs.auto_merge }}
      risk: ${{ steps.policy.outputs.risk }}
      class: ${{ steps.policy.outputs.class }}
      audit: ${{ steps.policy.outputs.audit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch evaluated head (data only)
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"

      - name: Merge policy of the evaluated head (main's rules)
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: python .harness/engine/cli.py policy --base origin/main --head "$HEAD_SHA" ${PR:+--pr "$PR"} --branch "$HEAD_BRANCH" --github

  # 不自动合并的：build 与 harness 通过后打类别标签并请仓库所有者评审，PR 出现在其待评审列表里。
  # 用 GITHUB_TOKEN 只「请求评审」，不批准（仓库已关闭 Actions 批准 PR）。
  # 所有者自己开的 PR 不能请自己评审，GitHub 拒绝时只记日志、不算失败。
  request-review:
    needs: judge
    if: needs.judge.outputs.auto_merge == 'false'
    runs-on: ubuntu-latest
    permissions:
      issues: write  # 创建类别标签
      pull-requests: write
    steps:
      - name: Label class and request owner review
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          RISK: ${{ needs.judge.outputs.risk }}
          CLASS: ${{ needs.judge.outputs.class }}
        run: |
          if [ -z "$PR" ]; then
            echo "没有关联的 PR，跳过"
            exit 0
          fi
          # 类别标签是误差预算的窗口依据（policy.py escapes_in_window）；escape 与 budget-exceeded 供登记使用。
          gh label create "class:$CLASS" --repo "$GITHUB_REPOSITORY" --color c5def5 --force >/dev/null
          gh label create escape --repo "$GITHUB_REPOSITORY" --color d93f0b --description "合并后才发现的逃逸缺陷，正文写明引入的 PR" --force >/dev/null
          gh label create budget-exceeded --repo "$GITHUB_REPOSITORY" --color d93f0b --description "超出任务预算，不自动合并" --force >/dev/null
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "class:$CLASS"
          # R2 及以上：标出待独立评审（设计 8.3，试行）；评审由非设计方经 bin/dispatch review 完成。
          if [ "$RISK" = "R2" ] || [ "$RISK" = "R3" ]; then
            gh label create needs-independent-review --repo "$GITHUB_REPOSITORY" --color 1d76db \
              --description "待非设计方独立评审（试行）" >/dev/null 2>&1 || true
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label needs-independent-review
          fi
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-reviewer "$OWNER" \
            || echo "未能请 $OWNER 评审（$RISK），可能是其本人开的 PR"

  # 只有判定为自动合并才进入 environment；其余不产生部署记录，也碰不到 App 凭据。
  merge:
    needs: judge
    if: needs.judge.outputs.auto_merge == 'true'
    runs-on: ubuntu-latest
    environment: auto-merge
    permissions:
      contents: write
      issues: write  # 类别标签与 audit 议题
      pull-requests: write
    steps:
      - name: App token (approve only)
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTO_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Label, approve and merge
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          RISK: ${{ needs.judge.outputs.risk }}
          CLASS: ${{ needs.judge.outputs.class }}
          AUDIT: ${{ needs.judge.outputs.audit }}
        run: |
          if [ -z "$PR" ]; then
            echo "没有关联的 PR，跳过"
            exit 0
          fi
          gh label create "class:$CLASS" --repo "$GITHUB_REPOSITORY" --color c5def5 --force >/dev/null
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "class:$CLASS"
          # 批准绑定到评估过的提交；之后若有新推送，ruleset 作废这次批准，等新一轮 build 再判定。
          GH_TOKEN="$APP_TOKEN" gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            -f commit_id="$HEAD_SHA" -f event=APPROVE \
            -f body="auto-merge：$RISK $CLASS，build 与 harness 通过，合并路由见本次 auto-merge 运行的 job summary（$HEAD_SHA）"
          # 只合并本次评估过的提交。
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$HEAD_SHA"
          # 抽样审计（决定 2）：被抽中的 PR 合并后开 audit 议题，由评审方审完关闭；发现问题另开 escape 议题。
          if [ "$AUDIT" = "true" ]; then
            gh label create audit --repo "$GITHUB_REPOSITORY" --color fbca04 --force >/dev/null
            gh issue create --repo "$GITHUB_REPOSITORY" --label audit --label "class:$CLASS" \
              --title "抽审：PR #$PR（$CLASS）" \
              --body "PR #$PR 按 .harness/config/autonomy.toml 的抽样规则被抽中（$RISK $CLASS，$HEAD_SHA）。评审方对照任务书、diff 与证据包审计；发现问题时另开带 escape 与 class:$CLASS 标签的议题，写明引入的 PR #$PR。"
          fi
